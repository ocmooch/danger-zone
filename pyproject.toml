[project]
name = "ff-pipeline"
version = "1.2.1"
description = "Phase 1 data foundation for a personal NFL fantasy football league — ingests NFL.com / nflverse / Sleeper, normalizes player identity, scores against the league's rules, and exposes a read API."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ocmooch", email = "cobs.direct0l@icloud.com" },
]
keywords = ["nfl", "fantasy-football", "etl", "sqlite", "fastapi"]

dependencies = [
    # HTTP + parsing
    "httpx>=0.27.0",                  # Modern async HTTP client
    "beautifulsoup4>=4.12.0",         # HTML parsing
    "lxml>=5.0.0",                    # Fast XML/HTML backend for bs4

    # NFL data
    "nflreadpy>=0.1.5",               # Successor to nfl_data_py (archived 2025)
    "polars>=1.0.0",                  # nflreadpy uses this; we'll use it for DataFrame ops too

    # Database
    "sqlalchemy[asyncio]>=2.0.30",    # ORM
    "alembic>=1.13.0",                # Migrations
    "psycopg[binary]>=3.2.0",         # Optional Postgres driver (no-op for SQLite)

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",      # ASGI server

    # CLI
    "typer>=0.12.0",                  # Same author as FastAPI

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",       # .env loading
    "python-dotenv>=1.0.0",           # Used by pydantic-settings

    # Logging
    "structlog>=24.1.0",
    "rich>=13.7.0",                   # Pretty console output for dev

    # Misc utilities
    "thefuzz[speedup]>=0.22.0",       # Fuzzy player-name matching
    "tenacity>=8.4.0",                # Retry logic
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",                  # httpx mocking
    "ruff>=0.5.0",                    # Linter + formatter (replaces black + flake8 + isort)
    "mypy>=1.10.0",                   # Type checker
    "pre-commit>=3.7.0",
    "ipython>=8.25.0",                # Better REPL for ad-hoc exploration
]

[project.scripts]
ff-pipeline = "ff_pipeline.cli:app"

# ============================================================
# Build system
# ============================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ff_pipeline"]

# ============================================================
# Ruff (linter + formatter)
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "ARG", # unused arguments
    "SIM", # simplify
    "TCH", # type-checking imports
    "TID", # tidy imports
    "PTH", # use pathlib
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# typer reads parameter annotations at runtime via get_type_hints(), so Path
# cannot be deferred to TYPE_CHECKING. Suppress for both ruff naming eras.
"src/ff_pipeline/cli.py" = ["TCH003", "ARG001"]

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy 2.0 reads typed annotations at runtime to infer column types
# (Mapped[datetime] -> DateTime, etc.). Moving those imports into a
# TYPE_CHECKING block would break model registration, so flag Base
# subclasses as runtime-evaluated.
runtime-evaluated-base-classes = [
    "ff_pipeline.repository.database.Base",
    "sqlalchemy.orm.DeclarativeBase",
    "pydantic.BaseModel",
]

# ============================================================
# MyPy (type checker)
# ============================================================

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true

# Be pragmatic about third-party untyped libs
[[tool.mypy.overrides]]
module = [
    "nflreadpy.*",
    "polars.*",
    "thefuzz.*",
]
ignore_missing_imports = true

# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (run with --runslow)",
    "network: marks tests as requiring network access",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:google.*:",
]

# ============================================================
# Coverage
# ============================================================

[tool.coverage.run]
source = ["src/ff_pipeline"]
branch = true
omit = [
    "*/migrations/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 75
show_missing = true
