name: CI

# A deliberately top-level gate: lint, type-check, and the fast deterministic
# unit suite (fixture-backed, no network). The slower integration tests
# (tests/integration/*) hit live NFL.com / nflverse and a real DB, so they stay
# a local/manual step rather than a per-PR deep dive — see docs/08_OPERATIONS.md.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check
      - run: uv run mypy src/
      - run: uv run pytest tests/unit -q
